name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tag pushes

# A newer push to the same branch or PR supersedes a running build; tag builds always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches the Gradle distribution, dependencies and the local build cache. Only builds on
      # main write to the cache; PRs and tags read from it. "basic" is the open-source cache
      # implementation, so no extra licence terms apply.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      # PRs only compile and run the unit tests: R8, resource shrinking and lint-vital are most of
      # the build time and only matter for the APK, which main and tag builds still produce. The
      # release variant keeps PRs testing what ships and reading the compile cache main writes.
      - name: Test
        if: github.event_name == 'pull_request'
        run: ./gradlew testReleaseUnitTest

      - name: Decode signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "BOKS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A release signed with a throwaway key could never be updated in place.
            echo "::error::KEYSTORE_BASE64 secret is not set; refusing to publish a release."
            exit 1
          else
            echo "No signing key available; building with the debug key."
          fi

      # Testing the release variant reuses its compiled classes instead of also compiling debug.
      - name: Test and build
        if: github.event_name != 'pull_request'
        env:
          BOKS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BOKS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BOKS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease

      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: |
          name="boks-remote-${GITHUB_REF_NAME//\//-}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$name"
          echo "APK=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          path: ${{ env.APK }}
          archive: false # downloads as the .apk itself rather than a zip around it

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --title "Boks Remote $GITHUB_REF_NAME" --generate-notes
